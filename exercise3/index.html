<!DOCTYPE html>
<html>
    <head>
        <title>Exercise 3</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="teddybeartext">
            <p>Hey! My teddy bear is gone!</p>
        </div>
        <div class="robottext">
            <p>Hey! My robot, too!</p>
         </div>
         <div class="soccerballtext">
            <p>Not my soccer ball!</p>
        </div>
        <div class="housetext">
            <p>My house!</p>
        </div>
        <div class="monster">
        <!-- hover and click images -->
            <img src="images/blankfacemonster.png" alt="little orange monster" class="blankfacemonster">
            <img src="images/smilingmonster.png" alt="smiling monster" class="smilingmonster">
            <img src="images/hearteyemonster.png" alt="heart eye monster" class="hearteyemonster">
        <!-- screen shrinking images -->
            <img src="images/slightlyannoyedmonster.png" alt="slightly annoyed monster" class="slightlyannoyedmonster">
            <img src="images/angrymonster.png" alt="angry monster" class="angrymonster">
            <img src="images/scaredmonster.png" alt="scared monster" class="scaredmonster">
            <img src="images/cryingmonster.png" alt="crying monster" class="cryingmonster">
        </div>
        <div class="house">
        <!-- house and toys -->
            <img src="images/cartoonhouse.png" alt="cartoon house" class="cartoonhouse">
            <img src="images/teddybear.png" alt="teddy bear" class="teddybear">
            <img src="images/soccerball.png" alt="soccer ball"
            class="soccerball">
            <img src="images/robot.png" alt="robot" class="robot">
        </div>
    </body>
</html>


<!-- 345x345px for monster images-->
